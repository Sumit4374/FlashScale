services:

  postgres:
    image: postgres:16
    container_name: flashscale-postgres
    environment:
      POSTGRES_DB: flashscale
      POSTGRES_USER: flashscale
      POSTGRES_PASSWORD: flashscale
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: flashscale-redis

  app1:
    image: flashscale:1.0
    container_name: flashscale-app1
    depends_on:
      - postgres
      - redis
    environment:
      INSTANCE_ID: app1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashscale
      SPRING_DATASOURCE_USERNAME: flashscale
      SPRING_DATASOURCE_PASSWORD: flashscale
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8081:8080"

  app2:
    image: flashscale:1.0
    container_name: flashscale-app2
    depends_on:
      - postgres
      - redis
    environment:
      INSTANCE_ID: app2
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashscale
      SPRING_DATASOURCE_USERNAME: flashscale
      SPRING_DATASOURCE_PASSWORD: flashscale
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8082:8080"

  app3:
    image: flashscale:1.0
    container_name: flashscale-app3
    depends_on:
      - postgres
      - redis
    environment:
      INSTANCE_ID: app3
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashscale
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: flashscale
      SPRING_DATASOURCE_PASSWORD: flashscale
    ports:
      - "8083:8080"

  nginx:
    image: nginx:alpine
    container_name: flashscale-nginx
    depends_on:
      - app1
      - app2
      - app3
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  postgres_data: